name: Android build and roster regression

on:
  pull_request:
    paths:
      - 'app/**'
      - '*gradle*'
      - 'gradle/**'
      - 'tools/test_roster_loader.py'
      - 'tools/android_smoke.py'
      - 'tools/verify_battle_save.py'
      - 'tools/package_tested_apk.py'
      - 'tools/tests/roster/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*gradle*'
      - 'gradle/**'
      - 'tools/test_roster_loader.py'
      - 'tools/android_smoke.py'
      - 'tools/verify_battle_save.py'
      - 'tools/package_tested_apk.py'
      - 'tools/tests/roster/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 14742923
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test transactional roster loading
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output "$RUNNER_TEMP/json.jar"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $RUNNER_TEMP/json.jar" | sha256sum --check
          python tools/test_roster_loader.py --json-jar "$RUNNER_TEMP/json.jar"
      - name: Build APK without original art
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check packaged Master and DEX
        run: |
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert 'classes.dex' in apk.namelist()
              master = json.loads(apk.read('assets/data/reconstructed_master_v1.json'))
              assert master['meta']['schema'] == 'sgpz-reconstructed-master'
              assert master['art_assets']['identities_verified'] == 0
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator UI and save regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python tools/android_smoke.py --serial emulator-5554 --apk app/build/outputs/apk/debug/app-debug.apk > ui-save-result.txt
            cat ui-save-result.txt
            adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb -s emulator-5554 shell am instrument -w com.openai.threekingdoms.test/com.openai.threekingdoms.test.BattleRegression > battle-test-result.txt
            cat battle-test-result.txt
            grep -q 'PASS: three stages, all waves, coins, EXP level-up, unlock, drops, duplicate guard, replay, defeat' battle-test-result.txt
            grep -q 'INSTRUMENTATION_CODE: -1' battle-test-result.txt
            adb -s emulator-5554 shell am force-stop com.openai.threekingdoms
            adb -s emulator-5554 exec-out run-as com.openai.threekingdoms cat shared_prefs/progress.xml > battle-progress.xml
            python tools/verify_battle_save.py battle-test-result.txt battle-progress.xml
            adb -s emulator-5554 shell am instrument -w -e suite playability com.openai.threekingdoms.test/com.openai.threekingdoms.test.BattleRegression > playability-result.txt
            cat playability-result.txt
            grep -q 'PASS: natural-board diagnostic completed' playability-result.txt
            grep -q 'INSTRUMENTATION_CODE: -1' playability-result.txt
            adb -s emulator-5554 shell am instrument -w -e suite skills com.openai.threekingdoms.test/com.openai.threekingdoms.test.BattleRegression > skill-result.txt
            cat skill-result.txt
            grep -q 'PASS: heal, delay, conversion, free move, damage, ignore defense, AoE, cooldown, seal, timeout, reset' skill-result.txt
            grep -q 'INSTRUMENTATION_CODE: -1' skill-result.txt
            adb -s emulator-5554 shell am instrument -w -e suite saves com.openai.threekingdoms.test/com.openai.threekingdoms.test.BattleRegression > save-result.txt
            cat save-result.txt
            grep -q 'PASS: save round-trip, ownership, equipment, loot, legacy level, invalid import unchanged, restored startup' save-result.txt
            grep -q 'INSTRUMENTATION_CODE: -1' save-result.txt
      - name: Package tested APK and reports
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/package_tested_apk.py
      - name: Upload tested Android build
        id: tested-apk
        uses: actions/upload-artifact@v7
        with:
          name: ThreeKingdom-tested-${{ github.run_number }}-${{ github.run_attempt }}
          path: tested-apk/
          if-no-files-found: error
          retention-days: 30
      - name: Link tested build
        env:
          ARTIFACT_URL: ${{ steps.tested-apk.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          info = json.loads(Path('tested-apk/build-info.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('[Download tested Android debug APK](' + os.environ['ARTIFACT_URL'] + ')\n\n')
              summary.write('Source: `' + info['source_head_sha'] + '`\n\n')
              summary.write('APK SHA-256: `' + info['apk_sha256'] + '`\n')
          PY
