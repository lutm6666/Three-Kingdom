name: Android build and roster regression

on:
  pull_request:
    paths:
      - 'app/**'
      - '*gradle*'
      - 'gradle/**'
      - 'tools/test_roster_loader.py'
      - 'tools/tests/roster/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*gradle*'
      - 'gradle/**'
      - 'tools/test_roster_loader.py'
      - 'tools/tests/roster/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test transactional roster loading
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar --output "$RUNNER_TEMP/json.jar"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $RUNNER_TEMP/json.jar" | sha256sum --check
          python tools/test_roster_loader.py --json-jar "$RUNNER_TEMP/json.jar"
      - name: Build APK without original art
        run: bash gradlew --no-daemon :app:assembleDebug
      - name: Check packaged Master and DEX
        run: |
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert 'classes.dex' in apk.namelist()
              master = json.loads(apk.read('assets/data/reconstructed_master_v1.json'))
              assert master['meta']['schema'] == 'sgpz-reconstructed-master'
              assert master['art_assets']['identities_verified'] == 0
          PY
